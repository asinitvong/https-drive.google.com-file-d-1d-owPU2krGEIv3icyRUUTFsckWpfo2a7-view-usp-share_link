<!DOCTYPE html>
<html>
<head>
  <title>My Website</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0f172a;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      text-align:center;
    }

    .box{
      max-width:600px;
    }

    h1{
      font-size:60px;
      margin-bottom:10px;
    }

    p{
      font-size:20px;
      color:#cbd5e1;
    }

    button{
      margin-top:20px;
      padding:15px 30px;
      border:none;
      border-radius:10px;
      background:#3b82f6;
      color:white;
      font-size:18px;
      cursor:pointer;
    }

    button:hover{
      background:#2563eb;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>🚀 My GitHub Website</h1>

  <p>
    Deploy สำเร็จแล้วบน GitHub Pages
  </p>

  <button onclick="alert('Hello World')">
    Click Me
  </button>
</div>

</body>
</html>
